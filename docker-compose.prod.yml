services:

  postgres:
    image: postgres:16-alpine
    container_name: garant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-garant}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-garant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ludogoriesoft/attendtrack-backend:latest
    container_name: garant-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-garant}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: ludogoriesoft/attendtrack-frontend:latest
    container_name: garant-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  postgres_data:
