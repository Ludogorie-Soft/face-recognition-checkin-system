services:

  postgres:
    image: postgres:16-alpine
    container_name: garant-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-garant}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-garant}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: garant-backend
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-garant}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: garant-frontend
    restart: unless-stopped
    environment:
      API_URL: http://backend:8080
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: garant-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - frontend

volumes:
  postgres_data:
