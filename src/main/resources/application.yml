spring:
  application:
    name: garant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/garant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT configuration
# IMPORTANT: Override JWT_SECRET with a strong random value in production (min 256-bit base64 encoded)
jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckdBUkFOVDkwQXBwbGljYXRpb24yMDI2}
  expiration: ${JWT_EXPIRATION:86400000}

server:
  port: ${SERVER_PORT:8080}

# Initial admin account — created on first startup if no admin exists
admin:
  name: ${ADMIN_NAME:Administrator}
  email: ${ADMIN_EMAIL:admin@example.com}
  password: ${ADMIN_PASSWORD:Admin@123!}

# Web Push VAPID keys
# Generate with: npx web-push generate-vapid-keys
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:admin@example.com}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
