spring:
  application:
    name: garant

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/garant}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT configuration
# IMPORTANT: Override JWT_SECRET with a strong random value in production (min 256-bit base64 encoded)
jwt:
  secret: ${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckdBUkFOVDkwQXBwbGljYXRpb24yMDI2}
  expiration: ${JWT_EXPIRATION:604800000}

server:
  port: ${SERVER_PORT:8080}

# Business time zone. Device timestamps are local wall-clock values, so the server must agree
# with them — otherwise synced_at, "today" and the schedulers drift by the UTC offset.
app:
  timezone: ${APP_TIMEZONE:Europe/Sofia}

attendance:
  # Two scans of the same worker at the same site closer than this count as one physical action
  # (double tap / face recognised twice). Keep it in the tens of seconds — a genuinely short shift
  # must survive. Observed accidental re-scans in production: 1-18 seconds.
  min-gap-seconds: ${ATTENDANCE_MIN_GAP_SECONDS:60}

  # A scan repeating the direction the terminal just reported is the same button pressed twice, and
  # counts as a re-scan within this wider window. Keep it in MINUTES. Observed in production: two
  # CHECK_OUTs 93 seconds apart, where the second was read as a check-IN and invented 1.8 hours.
  # Hours would be wrong in the other direction — the same pair 8 hours apart is a morning check-in
  # plus an evening scan the terminal mislabelled, and suppressing it would delete a real check-out.
  same-direction-gap-seconds: ${ATTENDANCE_SAME_DIRECTION_GAP_SECONDS:300}

  # A site zone is widened by the device's own reported GPS accuracy, capped here. Site corridors
  # can be as narrow as 10 m while a phone fix is routinely ±10-20 m, so without an allowance
  # in-zone becomes a coin toss. Without a cap, a bad fix reporting kilometres would validate
  # anything.
  geo-accuracy-cap-meters: ${ATTENDANCE_GEO_ACCURACY_CAP_METERS:50}

# Initial admin account — created on first startup if no admin exists
admin:
  name: ${ADMIN_NAME:Administrator}
  email: ${ADMIN_EMAIL:admin@example.com}
  password: ${ADMIN_PASSWORD:Admin@123!}

# Web Push VAPID keys
# Generate with: npx web-push generate-vapid-keys
vapid:
  public-key: ${VAPID_PUBLIC_KEY:}
  private-key: ${VAPID_PRIVATE_KEY:}
  subject: ${VAPID_SUBJECT:mailto:admin@example.com}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}


