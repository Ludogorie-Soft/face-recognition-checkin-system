events {
  worker_connections 1024;
}

http {
  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name 52.58.114.218.sslip.io;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name 52.58.114.218.sslip.io;

    # SSL certificate — place your cert files in ./certs/
    # Option A: Let's Encrypt  →  certbot certonly --standalone -d your-domain.com
    #           then copy fullchain.pem and privkey.pem to ./certs/
    # Option B: AWS ACM        →  use an Application Load Balancer for SSL termination
    #           and remove the ssl block, changing listen 443 ssl → listen 80
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    # All traffic → Next.js frontend
    location / {
      proxy_pass         http://frontend:3000;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade $http_upgrade;
      proxy_set_header   Connection 'upgrade';
      proxy_set_header   Host $host;
      proxy_cache_bypass $http_upgrade;
    }
  }
}
